<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="description" content="收藏一些喜歡，把想記得的都留在這裡。登入後就可以開始使用 ♡"><meta property="og:description" content="收藏一些喜歡，把想記得的都留在這裡。登入後就可以開始使用 ♡"><meta name="twitter:description" content="收藏一些喜歡，把想記得的都留在這裡。登入後就可以開始使用 ♡"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Little Space</title><link rel="stylesheet" href="style.css"></head><body>
<div id="auth" class="auth"><div class="authbox"><div class="heart">♡</div><h1>My Little Space</h1><p id="hint">登入後就可以保存你的資料。</p><form id="login"><input id="email" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="密碼（至少6位）" minlength="6" required><button>登入</button></form><button id="switch" class="link">還沒有帳號？註冊</button><div id="msg"></div></div></div>
<div id="app" class="hidden"><header><b>♡ My Little Space</b><div><button id="add">＋ 新增</button><button id="logout" class="gray">登出</button></div></header><main><section id="home"><div class="welcome"><h2 id="userName">user</h2><button id="editName" class="nameEdit" title="修改名稱">✎</button></div><div class="tiles">
<button class="tile pink" data-view="food">🍽️<strong>食物</strong><small>想去吃的店</small></button><button class="tile purple" data-view="wishlist">🛍️<strong>想買</strong><small>台灣・日本・其他</small></button><button class="tile blue" data-view="watchlist">🎬<strong>影劇</strong><small>韓劇・陸劇・電影</small></button><button class="tile green" data-view="todo">🧩<strong>生活管理</strong><small>提醒事項・行程</small></button></div></section>
<section id="list" class="hidden"><div class="head"><button id="back" class="gray">← 返回</button><h2 id="title"></h2><button id="add2">＋ 新增</button></div><div id="cats" class="catbar"></div><div id="cards" class="cards"></div></section></main></div>
<div id="modal" class="hidden modal"><div class="shade"></div><div class="box"><button id="close" class="x">×</button><h3 id="mtitle"></h3><form id="form"></form><p id="fmsg"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
